
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aistudio
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: ai_experiment_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aistudio -d ai_experiment_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
