<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:20px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.back{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.box{stroke-width:2;rx:8}.divider{stroke:#cbd5e1;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">AI Experiment Studio — System Architecture</text>
  <text x="800" y="88" text-anchor="middle" class="sub">Application request flow, document context, model providers, and data storage</text>

  <!-- Primary application flow -->
  <rect x="55" y="210" width="180" height="132" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="145" y="250" text-anchor="middle" class="head">User</text>
  <text x="145" y="280" text-anchor="middle" class="body">Browser</text>
  <text x="145" y="307" text-anchor="middle" class="small">Sends prompts</text>

  <rect x="310" y="175" width="285" height="205" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="452" y="215" text-anchor="middle" class="head">Web application</text>
  <text x="452" y="243" text-anchor="middle" class="small">Next.js + React</text>
  <line x1="330" y1="260" x2="575" y2="260" class="divider"/>
  <text x="340" y="292" class="body">• Chat and chat history</text>
  <text x="340" y="320" class="body">• Compare model responses</text>
  <text x="340" y="348" class="body">• Workspaces and analytics</text>

  <rect x="690" y="175" width="285" height="205" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="832" y="215" text-anchor="middle" class="head">API server</text>
  <text x="832" y="243" text-anchor="middle" class="small">Node.js + Express</text>
  <line x1="710" y1="260" x2="955" y2="260" class="divider"/>
  <text x="720" y="292" class="body">• Authentication</text>
  <text x="720" y="320" class="body">• Request and provider routing</text>
  <text x="720" y="348" class="body">• Saves chats and experiment data</text>

  <rect x="1080" y="170" width="450" height="220" class="box" fill="#f0fdf4" stroke="#22a06b"/>
  <text x="1305" y="210" text-anchor="middle" class="head">AI model providers</text>
  <rect x="1105" y="235" width="190" height="125" class="box" fill="#ffffff" stroke="#86c99f"/>
  <text x="1200" y="275" text-anchor="middle" class="body" font-weight="700">Local Ollama</text>
  <text x="1200" y="303" text-anchor="middle" class="small">Models on local machine</text>
  <text x="1200" y="329" text-anchor="middle" class="small">when configured</text>
  <rect x="1315" y="235" width="190" height="125" class="box" fill="#ffffff" stroke="#86c99f"/>
  <text x="1410" y="275" text-anchor="middle" class="body" font-weight="700">Cloud providers</text>
  <text x="1410" y="303" text-anchor="middle" class="small">Configured AI services</text>
  <text x="1410" y="329" text-anchor="middle" class="small">using provider settings</text>

  <path d="M235 255 H310" class="line"/><text x="272" y="238" text-anchor="middle" class="small">Use app</text>
  <path d="M595 255 H690" class="line"/><text x="642" y="238" text-anchor="middle" class="small">API request</text>
  <path d="M975 255 H1080" class="line"/><text x="1027" y="235" text-anchor="middle" class="small">Prompt + context</text>
  <path d="M1080 322 H975" class="back"/><text x="1027" y="348" text-anchor="middle" class="small">Model response</text>
  <path d="M690 322 H595" class="back"/><text x="642" y="348" text-anchor="middle" class="small">Response</text>
  <path d="M310 322 H235" class="back"/><text x="272" y="348" text-anchor="middle" class="small">Display answer</text>

  <!-- Persistence -->
  <rect x="700" y="455" width="265" height="75" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="832" y="485" text-anchor="middle" class="body" font-weight="700">Prisma ORM</text>
  <text x="832" y="510" text-anchor="middle" class="small">Database access layer</text>
  <rect x="665" y="580" width="335" height="165" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="832" y="615" text-anchor="middle" class="head">PostgreSQL database</text>
  <line x1="685" y1="630" x2="980" y2="630" class="divider"/>
  <text x="705" y="662" class="body">Users • Workspaces • Chats</text>
  <text x="705" y="692" class="body">Experiments • Documents • Ratings</text>
  <text x="832" y="725" text-anchor="middle" class="small">Persistent project data</text>
  <path d="M832 380 V455" class="line"/><text x="850" y="425" class="small">Read / write</text>
  <path d="M832 530 V580" class="line"/>

  <!-- Document context flow -->
  <rect x="55" y="500" width="260" height="180" class="box" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="185" y="540" text-anchor="middle" class="head">Workspace documents</text>
  <text x="185" y="573" text-anchor="middle" class="body">TXT • MD • CSV • PDF • DOCX</text>
  <text x="185" y="610" text-anchor="middle" class="small">Uploaded and saved to workspace</text>
  <text x="185" y="638" text-anchor="middle" class="small">Text is extracted for retrieval</text>

  <rect x="365" y="500" width="240" height="180" class="box" fill="#fffbeb" stroke="#eab308"/>
  <text x="485" y="540" text-anchor="middle" class="head">Context selection</text>
  <text x="485" y="580" text-anchor="middle" class="body">Match document text</text>
  <text x="485" y="608" text-anchor="middle" class="body">to the user’s question</text>
  <text x="485" y="642" text-anchor="middle" class="small">Include relevant excerpts</text>
  <path d="M315 590 H365" class="line"/>
  <path d="M605 590 H635 V410 H832 V380" class="line"/>
  <text x="720" y="402" text-anchor="middle" class="small">Relevant excerpts join request</text>

  <rect x="1070" y="500" width="460" height="180" class="box" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="1300" y="540" text-anchor="middle" class="head">Experiment review</text>
  <text x="1300" y="578" text-anchor="middle" class="body">Review saved responses, compare outputs,</text>
  <text x="1300" y="606" text-anchor="middle" class="body">and analyze quality and usage</text>
  <text x="1300" y="645" text-anchor="middle" class="small">Results remain available in the workspace</text>
  <path d="M975 360 H1020 V590 H1070" class="line"/>
  <text x="1035" y="475" class="small" transform="rotate(90 1035 475)">Saved results for review</text>

  <text x="800" y="830" text-anchor="middle" class="sub">Document excerpts are added when relevant; the selected model generates the response.</text>
</svg>
